<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;color:#183543;background:#f5f8fb;font:14px system-ui,sans-serif}button,input{font:inherit}button{padding:8px 13px;border:1px solid #9dbbc4;border-radius:7px;background:white;color:#075965;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #e26d3c}.controls,.readout{padding:12px;border:1px solid #dce6ec;border-radius:9px;background:white;margin-bottom:10px}.buttons{display:flex;gap:8px;flex-wrap:wrap;align-items:center}label{display:block;margin:10px 0 5px}input[type=range]{width:100%;accent-color:#087f8c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.panel{background:white;border:1px solid #dce6ec;border-radius:9px;padding:10px;min-width:0}h3{font-size:15px;margin:0 0 8px}canvas{width:100%;height:245px;display:block}.caption{font-size:13px;line-height:1.65;margin:8px 0 12px}.readout{line-height:1.8;font-variant-numeric:tabular-nums}#flowPanel{margin-top:10px}#flow{height:135px}.highlight{color:#b54a1d;font-weight:600}@media(max-width:650px){.grid{grid-template-columns:1fr}canvas{height:230px}}
.readout{white-space:pre-line}
</style></head><body>
<div class="controls">
 <div class="buttons"><button id="play" aria-label="애니메이션 재생">재생</button><button id="reset">처음으로</button><button id="maximum">최대속도 위치</button><span>한 주기 8초 · 자동 반복</span></div>
 <label id="frameLabel" for="frame">프레임 이동</label><input id="frame" type="range" min="0" max="800" value="0" step="1">
 <div id="speedControl"><label for="speed">입자 재생속도 조절 (기준 배율의 배수)</label><input id="speed" type="range" min="0.25" max="4" step="0.25" value="1"></div>
</div>
<div class="readout" id="readout" aria-live="off"></div>
<div class="grid"><div class="panel"><h3 id="structureTitle">이중관 종단면 · 축방향 입자 이동</h3><canvas id="structure" role="img" aria-label="동심 이중관의 구조와 입자 이동"></canvas></div>
<div class="panel"><h3>계산된 속도분포와 반지름 위치</h3><canvas id="profile" role="img" aria-label="실제 계산 속도분포와 이동하는 반지름 점"></canvas></div></div>
<div class="caption" id="meaning"></div>
<div class="panel" id="flowPanel"><h3>형상비에 따른 유량 · 주황색 점은 현재 조건</h3><canvas id="flow" role="img" aria-label="기존 30조건의 유량과 현재 프레임"></canvas></div>
<div class="caption" id="flowMeaning"></div>
<script>
'use strict';
const data=__ANIMATION_DATA__;
const $=id=>document.getElementById(id), basic=data.mode==='basic';
const frames=data.frames, first=frames[0], globalU=Math.max(...frames.map(f=>f.um));
let phase=0,simTime=0,playing=false,last=0,lastDraw=0,speed=1;
const multiplier=data.length/(8*globalU); // 재생 배율일 뿐 실제 속도값을 변경하지 않는다.
const superMap={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function fmt(x){if(x===0)return '0';if(Math.abs(x)<.001||Math.abs(x)>=1e5){const [m,e]=x.toExponential(5).split('e');return m+' × 10'+String(Number(e)).split('').map(c=>superMap[c]||c).join('')}return Number(x.toPrecision(6)).toString()}
function setup(id){const c=$(id),rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(1,rect.width*dpr);c.height=rect.height*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.font='12px system-ui';return [ctx,rect.width,rect.height]}
function text(ctx,t,x,y,color='#183543'){ctx.fillStyle=color;ctx.fillText(t,x,y)}
function line(ctx,x1,y1,x2,y2,color='#a7bec5',dash=[]){ctx.beginPath();ctx.setLineDash(dash);ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.stroke();ctx.setLineDash([])}
function dot(ctx,x,y,color='#087f8c',radius=3){ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function curve(ctx,xs,ys,X,Y,color='#087f8c'){ctx.beginPath();xs.forEach((x,i)=>i?ctx.lineTo(X(x),Y(ys[i])):ctx.moveTo(X(x),Y(ys[i])));ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1}
function state(){const index=basic?0:Math.min(29,Math.floor(phase*30));const f=frames[index];const maxIndex=f.r.indexOf(f.rm);
 // 최대속도 위치에서 약 1초 머무른 뒤 외벽까지 탐색한다.
 let scan=phase<.44?phase/.44*.5:phase<.56?.5:.5+(phase-.56)/.44*.5;
 let j=scan<=.5?Math.round(scan*2*maxIndex):maxIndex+Math.round((scan-.5)*2*(f.r.length-1-maxIndex));
 return {f,index,j:Math.min(f.r.length-1,j)}}
function draw(){const {f,index,j}=state();const r=f.r[j];const [ctx,w,h]=setup('structure');const left=42,right=w-15,cy=h/2,scale=(h/2-35)/f.ro;
 ctx.fillStyle='#e5f4f7';ctx.fillRect(left,cy-f.ro*scale,right-left,2*f.ro*scale);
 ctx.fillStyle='#d5dce0';ctx.fillRect(left,cy-f.ri*scale,right-left,2*f.ri*scale);
 [f.ro,-f.ro,f.ri,-f.ri].forEach(rad=>line(ctx,left,cy-rad*scale,right,cy-rad*scale,'#516a75'));
 line(ctx,left,cy,right,cy,'#b1bec2',[4,4]);text(ctx,'축 +z →',left,h-5);text(ctx,'외벽 Ro',left,13);text(ctx,'내관',left+4,cy-5);
 [-1,1].forEach(sign=>{const y=cy-sign*f.rm*scale;line(ctx,left,y,right,y,'#e26d3c',[4,3])});
 if(basic){const rowIndices=[...new Set([0,...Array.from({length:13},(_,i)=>Math.round(i*(f.r.length-1)/12)),f.r.length-1])];
 rowIndices.forEach(n=>[-1,1].forEach(sign=>{for(let p=0;p<5;p++){const distance=((p/5*data.length+f.u[n]*simTime)%data.length+data.length)%data.length;dot(ctx,left+distance/data.length*(right-left),cy-sign*f.r[n]*scale,n===0||n===f.r.length-1?'#516a75':'#087f8c',n===0||n===f.r.length-1?2:3)}}));
 dot(ctx,right-6,cy-r*scale,'#d65324',4);
 }else{text(ctx,'Ri = '+fmt(f.ri*1000)+' mm',left,cy+17);text(ctx,'간극 = '+fmt((f.ro-f.ri)*1000)+' mm',left,h-23)}
 text(ctx,basic?'회색 벽면 점: 정지 · 주황 점선: r_max':'축방향 길이·반지름은 도식적으로 표현',left,30);
 const [g,pw,ph]=setup('profile'),X=x=>48+(x/f.ro)*(pw-65),Y=y=>ph-38-y/globalU*(ph-65);
 line(g,48,ph-38,pw-12,ph-38);line(g,48,ph-38,48,20);curve(g,f.r,f.u,X,Y);dot(g,X(f.rm),Y(f.um),'#e26d3c',4);
 if(basic){dot(g,X(r),Y(f.u[j]),'#a32b76',5);line(g,X(r),ph-38,X(r),Y(f.u[j]),'#a32b76',[3,3])}
 text(g,'u [m/s]',5,14);text(g,'0',28,ph-35);text(g,fmt(globalU),3,30);text(g,'r: 중심축으로부터 거리 [mm]',48,ph-5);text(g,'0',44,ph-22);text(g,fmt(f.ro*1000),pw-43,ph-22);
 if(basic){const atMax=j===f.r.indexOf(f.rm);const grad=f.gradient[j],tau=f.tau[j];
 $('readout').textContent='r = '+fmt(r*1000)+' mm · u(r) = '+fmt(f.u[j])+' m/s · du/dr = '+(atMax&&Math.abs(grad)<data.gradient_tolerance?'약 0':fmt(grad))+' s⁻¹ · τ = '+(atMax&&Math.abs(tau)<data.stress_tolerance?'약 0':fmt(tau))+' Pa'+(atMax?' · 최대속도 위치: 속도구배와 전단응력 ≈ 0':'')+'\n실제 유속은 위 값이며 입자 이동만 '+fmt(multiplier*speed)+'배속 · 물리 경과시간 '+fmt(simTime)+' s';
 $('frameLabel').textContent='반지름 탐색 / 시간 프레임: '+fmt(phase*8)+' / 8초';
 }else{$('readout').textContent='조건 '+(index+1)+' / 30 · Ri/Ro = '+fmt(f.k)+' · Ro = '+fmt(f.ro*1000)+' mm (고정) · Q = '+fmt(f.q)+' m³/s · u_max = '+fmt(f.um)+' m/s';
 $('frameLabel').textContent='형상비 프레임: '+(index+1)+' / 30 (8초에 30조건 비교)';
 const [q,qw,qh]=setup('flow'),QX=k=>48+(k-.1)/.8*(qw-68),QY=v=>qh-30-v/frames[0].q*(qh-50);
 line(q,48,qh-30,qw-15,qh-30);curve(q,frames.map(a=>a.k),frames.map(a=>a.q),QX,QY);dot(q,QX(f.k),QY(f.q),'#e26d3c',5);text(q,'Q [m³/s]',4,12);text(q,fmt(frames[0].q),4,28);text(q,'0.1',43,qh-12);text(q,'0.9   Ri/Ro',qw-90,qh-12);
 }
 $('frame').value=Math.round(phase*800);
}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'일시정지':'재생';$('play').setAttribute('aria-label',playing?'애니메이션 일시정지':'애니메이션 재생');last=0};
$('reset').onclick=()=>{phase=0;simTime=0;draw()};
$('frame').oninput=e=>{phase=Number(e.target.value)/800;simTime=phase*8*multiplier*speed;playing=false;$('play').textContent='재생';$('play').setAttribute('aria-label','애니메이션 재생');draw()};
$('speed').oninput=e=>{speed=Number(e.target.value);draw()};
$('maximum').onclick=()=>{phase=.5;simTime=4*multiplier*speed;playing=false;$('play').textContent='재생';$('play').setAttribute('aria-label','애니메이션 재생');draw()};
if(!basic){$('maximum').hidden=true;$('speedControl').hidden=true;$('structureTitle').textContent='외반지름 고정 · 내관과 유로 폭 변화'}else{$('flowPanel').hidden=true}
$('meaning').textContent=basic?'입자는 실제 u(r)에 비례해 이동합니다. 고정된 양쪽 벽의 점은 정지하고 내부의 점은 더 빠르게 이동합니다. 화면 끝에서 다시 나타나는 것은 반복 표시이며 실제 재순환을 뜻하지 않습니다.':'기존 30조건을 차례로 보여주는 비교 애니메이션입니다. 실제 운전 중 관이 변형되는 비정상 유동을 계산한 것은 아닙니다.';
$('flowMeaning').textContent=basic?'보라색 점이 반지름을 따라 움직이며 실제 계산된 u(r), du/dr, τ(r)을 표시합니다. 최대속도 위치에서 du/dr과 τ가 0에 가깝고 속도구배 부호가 바뀝니다.':'Ro·점도·관 길이·압력차가 같을 때 Ri가 커지면 간극이 좁아지고 유량과 최대속도가 감소합니다. 모든 곡선은 같은 축 범위로 비교합니다.';
document.addEventListener('visibilitychange',()=>{last=0});
function tick(now){if(playing&&!document.hidden){const dt=last?Math.min((now-last)/1000,.1):0;phase=(phase+dt/8)%1;simTime+=dt*multiplier*speed;if(now-lastDraw>32){draw();lastDraw=now}}last=now;requestAnimationFrame(tick)}
window.addEventListener('resize',draw);draw();requestAnimationFrame(tick);
</script></body></html>
